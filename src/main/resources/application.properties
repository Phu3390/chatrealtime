spring.application.name=chatrealtime
server.port=8080

server.frontend.url=http://localhost:5173

spring.datasource.url=jdbc:postgresql://localhost:5433/realtime_chat
spring.datasource.username=postgres
spring.datasource.password=01596321
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=7af60a6cd75548d161f8eb420c0be88e
jwt.expiration=2

# Cấu hình để bắt lỗi 404 và trả về JSON thay vì trang lỗi mặc định
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# OAuth2 qua gateway
server.forward-headers-strategy=framework

# Session cho OAuth2
server.servlet.session.cookie.http-only=true
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.path=/
server.servlet.session.timeout=30m

server.servlet.session.cookie.same-site=lax
